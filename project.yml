# Джерело істини для Xcode-проєкту (XcodeGen: https://github.com/yonaskolb/XcodeGen).
# Генерація:  xcodegen generate   →   SmokeFree.xcodeproj
name: SmokeFree

options:
  bundleIdPrefix: com.wh1sp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Для запуску на фізичному пристрої вкажіть свою Team (на симуляторі не потрібно):
    DEVELOPMENT_TEAM: ""

targets:
  SmokeFree:
    type: application
    platform: iOS
    sources:
      - path: SmokeFree
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wh1sp.SmokeFree
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SmokeFree
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  SmokeFreeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SmokeFreeTests
    dependencies:
      - target: SmokeFree
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wh1sp.SmokeFreeTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SmokeFree:
    build:
      targets:
        SmokeFree: all
        SmokeFreeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SmokeFreeTests
